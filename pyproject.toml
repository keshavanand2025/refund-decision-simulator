[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refund-decision-simulator"
version = "2.0.0"
description = "CODA: Cost-Optimal Decision Algorithm for fraud detection — optimises economic cost rather than classification accuracy for refund decisions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Keshav Anand" }]
keywords = ["fraud-detection", "cost-sensitive-learning", "machine-learning", "decision-theory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "xgboost>=3.2",
    "lightgbm>=4.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/keshavanand2025/refund-decision-simulator"
Issues = "https://github.com/keshavanand2025/refund-decision-simulator/issues"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
